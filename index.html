<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Monge Surface AR</title>
    <!-- Підключаємо бібліотеки A-Frame та AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
      // Компонент для генерації вашої фігури Монжа
      AFRAME.registerComponent("monge-surface", {
        init: function () {
          let geometry = new THREE.BufferGeometry();
          let vertices = [];
          let indices = [];

          // Параметри фігури
          let r = 1.3,
            c = 1.7,
            d = 1.6,
            theta0 = 1.57;
          let uSteps = 88,
            vSteps = 58;
          let uMax = 2.4 * Math.PI,
            vMin = -2 * Math.PI,
            vMax = 2 * Math.PI;

          function P(u, v) {
            let x =
              r * Math.cos(u) -
              (r * (theta0 - u) +
                v * Math.cos(theta0) -
                c * Math.sin(d * v) * Math.sin(theta0)) *
                Math.sin(u);
            let y =
              r * Math.sin(u) +
              (r * (theta0 - u) +
                v * Math.cos(theta0) -
                c * Math.sin(d * v) * Math.sin(theta0)) *
                Math.cos(u);
            let z =
              v * Math.sin(theta0) + c * Math.sin(d * v) * Math.cos(theta0);
            return [x, y, z];
          }

          // Генерація точок
          for (let i = 0; i <= uSteps; i++) {
            let u = (i * uMax) / uSteps;
            for (let j = 0; j <= vSteps; j++) {
              let v = vMin + (j * (vMax - vMin)) / vSteps;
              let p = P(u, v);
              // Зменшуємо координати, щоб фігура помістилася на екрані
              vertices.push(p[0] / 5, p[1] / 5, p[2] / 5);
            }
          }

          // Генерація полігонів
          for (let i = 0; i < uSteps; i++) {
            for (let j = 0; j < vSteps; j++) {
              let p00 = i * (vSteps + 1) + j;
              let p01 = p00 + 1;
              let p10 = (i + 1) * (vSteps + 1) + j;
              let p11 = p10 + 1;
              indices.push(p00, p01, p10);
              indices.push(p01, p11, p10);
            }
          }

          geometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(vertices, 3),
          );
          geometry.setIndex(indices);
          geometry.computeVertexNormals();

          let material = new THREE.MeshNormalMaterial({
            wireframe: true,
            side: THREE.DoubleSide,
          });

          let mesh = new THREE.Mesh(geometry, material);
          this.el.setObject3D("mesh", mesh);
        },
      });
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden">
    <!-- Сцена AR.js -->
    <a-scene
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
      <a-marker type="pattern" url="src/marker.patt">
        <a-entity
          monge-surface
          scale="0.2 0.2 0.2"
          rotation="-90 0 0"
          position="0 0.5 0"
        ></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
